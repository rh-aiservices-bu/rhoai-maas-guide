---
# Egress tunnel for MaaS external models on a proxy-only cluster.
#
# The MaaS gateway opens an ordinary TLS connection to the provider FQDN. This
# tunnel accepts that raw TCP, sends an HTTP CONNECT to the corporate proxy and
# splices the bytes through. TLS is terminated by the provider, NOT here, so SNI,
# certificate validation and the injected api-key header all stay end-to-end and
# the proxy only ever sees an opaque tunnel.
#
# It uses Envoy's tcp_proxy tunneling_config, so the CONNECT target is a
# HOSTNAME - the proxy resolves it. That matters on clusters that cannot resolve
# the provider's name themselves.
#
# WARNING: tunneling_config.hostname and the Service name below are per-provider.
# Replace maas-aoai-kfhjq.openai.azure.com with your own Azure OpenAI resource
# hostname, and deploy one tunnel per external provider you expose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-tunnel-config
  namespace: egress-proxy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          # localhost only. Envoy's admin API is unauthenticated and exposes
          # /quitquitquit and /config_dump, so it must never listen on the pod IP.
          # Reach it with: oc exec deploy/egress-tunnel -- curl -s localhost:9902/stats
          address: 127.0.0.1
          port_value: 9902
    static_resources:
      listeners:
      - name: azure_openai_tunnel
        address:
          socket_address:
            address: 0.0.0.0
            # 8443, not 443: restricted-v2 drops CAP_NET_BIND_SERVICE, so a
            # non-root container cannot bind a privileged port. The Service
            # maps 443 -> 8443.
            port_value: 8443
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: azure_openai_tunnel
              cluster: corporate_proxy
              tunneling_config:
                hostname: "maas-aoai-kfhjq.openai.azure.com:443"
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    text_format_source:
                      inline_string: "TUNNEL downstream=%DOWNSTREAM_REMOTE_ADDRESS% proxy=%UPSTREAM_HOST% flags=%RESPONSE_FLAGS% dur=%DURATION%\n"
      clusters:
      - name: corporate_proxy
        connect_timeout: 10s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        # CONNECT is issued to the proxy over HTTP/1.1.
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options: {}
        load_assignment:
          cluster_name: corporate_proxy
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    # Your corporate proxy. With the lab proxy from
                    # forward-proxy.yaml this is the in-cluster Service.
                    address: egress-proxy.egress-proxy.svc.cluster.local
                    port_value: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-tunnel
  namespace: egress-proxy
  labels:
    app: egress-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-tunnel
  template:
    metadata:
      labels:
        app: egress-tunnel
    spec:
      containers:
        - name: envoy
          # Replace with your cluster's gateway image, see the guide:
          #   oc get pod -n openshift-ingress -l gateway.networking.k8s.io/gateway-name=maas-default-gateway \
          #     -o jsonpath='{.items[0].spec.containers[?(@.name=="istio-proxy")].image}'
          image: registry.redhat.io/openshift-service-mesh/istio-proxyv2-rhel9@sha256:2b5f5aa5ee9974269d8e3666b1bfc58da10c172bf3f1d6defd555fbd1ac9a6ec
          command: ["/usr/local/bin/envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 8443
              name: tunnel
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: egress-tunnel-config
---
apiVersion: v1
kind: Service
metadata:
  name: egress-tunnel
  namespace: egress-proxy
spec:
  selector:
    app: egress-tunnel
  ports:
    - name: https
      port: 443
      targetPort: 8443
