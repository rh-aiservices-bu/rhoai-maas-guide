apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: azure-openai-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Azure OpenAI Access"
    openshift.io/description: "Grants all authenticated users access to the Azure OpenAI external model"
spec:
  modelRefs:
    - name: azure-gpt-4-1-mini
      namespace: external-models
  subjects:
    groups:
      - name: system:authenticated
    users: []
