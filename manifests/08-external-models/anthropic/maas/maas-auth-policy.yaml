apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: anthropic-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Anthropic Access"
    openshift.io/description: "Grants all authenticated users access to the Anthropic external model"
spec:
  modelRefs:
    - name: claude-haiku-4-5
      namespace: external-models
  subjects:
    groups:
      - name: system:authenticated
    users: []
