    openshift.io/display-name: "OIDC ML Engineers"
    openshift.io/description: "Subscription for external OIDC ml-engineers group"
spec:
  owner:
    groups:
      - name: ml-engineers
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 20
