apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  # Change this name to something that identifies the new model version.
  # Example: qwen-38, granite-v2, gemma-2-9b-v2
  name: <new-model-name>
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    # IMPORTANT: this must match the existing model's spec.model.name exactly.
    # BBR (body-based routing) uses this field to route inference requests.
    # If the names differ, customers would need to change the model ID in their API calls.
    name: <vendor/model-name>
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - <vendor/model-name>
          - --mode
          - random
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
