  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - IT Division"
    openshift.io/description: "IT runs the platform and the pilots - access to all six models"
spec:
  modelRefs:
    - name: gpt-oss-120b
      namespace: llm
    - name: kimi-k3
      namespace: llm
    - name: nemotron-lightning
      namespace: llm
    - name: claude-opus-5-1
      namespace: cloud-models
    - name: gemini-3-pro
