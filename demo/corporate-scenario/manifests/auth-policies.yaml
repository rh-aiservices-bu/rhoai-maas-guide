# Fed Aura Capital: one auth policy per division
#
# Auth policies grant, per division, exactly the models in the access matrix.
# Everything else is hidden from the catalog - and 403 at the API if addressed
# directly.
#
# Access matrix (hourly token caps live in subscriptions.yaml):
#   gpt-oss-120b            sales, branch, credit, developers, IT, risk, marketing
#   kimi-k3                 developers, IT
#   nemotron-lightning      sales, branch, credit, developers, IT, risk, marketing
#   claude-opus-5-1         sales, IT, marketing
#   gemini-3-pro            IT, marketing
#   terra-large-context     sales, IT
#
# NOTE: the base guide's simulator model (facebook/opt-125m-simulated) is hidden
# from the demo catalogs: setup-demo.sh removes the shipped simulator-access
# policy (system:authenticated) right after applying this file; cleanup-demo.sh
# restores it.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: fedaura-sales-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - Sales Division"
    openshift.io/description: "Sales may call Claude Opus 5.1, Terra (cloud) and GPT-OSS 120B, Nemotron 30B (on-prem)"
spec:
  modelRefs:
    - name: claude-opus-5-1
      namespace: cloud-models
    - name: gpt-oss-120b
      namespace: llm
    - name: nemotron-lightning
      namespace: llm
    - name: terra-large-context
      namespace: cloud-models
  subjects:
    groups:
      - name: fedaura-sales
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: fedaura-branch-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - Branch Division"
    openshift.io/description: "Branch may call GPT-OSS 120B, Nemotron 30B (on-prem)"
spec:
  modelRefs:
    - name: gpt-oss-120b
      namespace: llm
    - name: nemotron-lightning
      namespace: llm
