# Fed Aura Capital: MaaSModelRef for every fake model
#
# The catalog display name comes from the openshift.io/display-name annotation;
# the served name comes from LLMInferenceService.spec.model.name. The URL path
# uses the namespace, which is how on-prem and cloud are visually separated.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: gpt-oss-120b
  namespace: llm
  annotations:
    openshift.io/display-name: "GPT-OSS 120B"
    openshift.io/description: "On-prem general purpose model (real deployment: RedHatAI gpt-oss-120b)"
spec:
  modelRef:
    kind: LLMInferenceService
    name: gpt-oss-120b
---
