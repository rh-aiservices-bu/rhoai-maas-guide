spec:
  owner:
    groups:
      - name: fedaura-developers
    users: []
  modelRefs:
    - name: gpt-oss-120b
      namespace: llm
      tokenRateLimits:
        - limit: 2000000
          window: 1h
    - name: kimi-k3
      namespace: llm
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: nemotron-lightning
      namespace: llm
      tokenRateLimits:
        - limit: 1000000
          window: 1h
  priority: 30
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: fedaura-it
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - IT Division"
    openshift.io/description: "Runs the platform and the pilots - all six models, ~5x standard caps"
spec:
  owner:
    groups:
      - name: fedaura-it
    users: []
  modelRefs:
    - name: gpt-oss-120b
      namespace: llm
      tokenRateLimits:
        - limit: 10000000
          window: 1h
    - name: kimi-k3
      namespace: llm
      tokenRateLimits:
        - limit: 5000000
          window: 1h
    - name: nemotron-lightning
      namespace: llm
      tokenRateLimits:
        - limit: 5000000
          window: 1h
    - name: claude-opus-5-1
      namespace: cloud-models
      tokenRateLimits:
        - limit: 1250000
          window: 1h
    - name: gemini-3-pro
      namespace: cloud-models
      tokenRateLimits:
        - limit: 250000
          window: 1h
    - name: terra-large-context
      namespace: cloud-models
      tokenRateLimits:
        - limit: 500000
          window: 1h
  priority: 30
