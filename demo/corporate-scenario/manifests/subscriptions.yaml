# Fed Aura Capital: one subscription per division
#
# Caps are a property of cost, not of capability: on-prem models run on GPUs the
# bank already bought (CAPEX), so their caps are generous; cloud models are
# rented per token, so their caps are tight. IT gets roughly five times the
# standard caps because it runs the platform and the pilots.
#
# Each division gets ONE subscription covering all of its models, and priority 30
# so the division tier outranks the shipped simulator-free (10) and
# simulator-premium (20) subscriptions, both targeting system:authenticated.
# Users mint their own API keys; every key they hold carries the division tier.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: fedaura-sales
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - Sales Division"
    openshift.io/description: "Public-facing: cloud general purpose (Claude Opus 5.1), 250K tokens/hour"
spec:
  owner:
    groups:
      - name: fedaura-sales
    users: []
  modelRefs:
    - name: claude-opus-5-1
      namespace: cloud-models
      tokenRateLimits:
        - limit: 250000
          window: 1h
  priority: 30
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: fedaura-branch
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Fed Aura - Branch Division"
    openshift.io/description: "Public-facing: on-prem general purpose (GPT-OSS 120B), 2M tokens/hour"
spec:
  owner:
    groups:
      - name: fedaura-branch
    users: []
  modelRefs:
    - name: gpt-oss-120b
      namespace: llm
      tokenRateLimits:
        - limit: 2000000
          window: 1h
  priority: 30
---
apiVersion: maas.opendatahub.io/v1alpha1
