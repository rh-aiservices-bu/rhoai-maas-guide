# A stand-in for a third-party model provider such as OpenAI.
#
# An OpenAI-compatible simulator published on its own HTTPS hostname, outside
# MaaS. MaaS reaches it exactly as it would reach api.openai.com: through an
# ExternalProvider pointing at the hostname.
#
# It runs in echo mode - it replies with the prompt it received - so a reply
# proves the request travelled through MaaS to the provider and back.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-external-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-llm-provider
  namespace: demo-external-provider
  labels: {app: external-llm-provider}
spec:
  replicas: 1
  selector:
    matchLabels: {app: external-llm-provider}
  template:
    metadata:
      labels: {app: external-llm-provider}
    spec:
      containers:
        - name: provider
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1
          imagePullPolicy: IfNotPresent
          command: ["/app/llm-d-inference-sim"]
          args: ["--port", "8000", "--model", "external-chat", "--mode", "echo"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: external-llm-provider
  namespace: demo-external-provider
spec:
  selector: {app: external-llm-provider}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: external-llm-provider
  namespace: demo-external-provider
spec:
  to:
    kind: Service
    name: external-llm-provider
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
